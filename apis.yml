name: GetPaid
description: >-
  Getpaid is a licensed European (EEA) embedded-payments platform that lets
  software platforms and marketplaces process payments while keeping the merchant
  relationship and capturing the transaction margin. It provides white-labeled
  hosted checkout across 30+ payment methods, atomic real-time split settlement
  that distributes a single transaction across sellers, the platform and agents,
  seller onboarding with KYC/KYB, subscriptions and invoicing with SEPA Direct
  Debit, and an AI-native agent-payments API with scoped authority tokens and
  spending limits. The v2 REST API uses OAuth 2.0 client-credentials auth,
  cursor pagination, RFC 7807 problem-details errors, an idempotency-key header,
  and 10 webhook events. Getpaid is a PCI-DSS Level 1, GDPR- and PSD2/SCA-aligned
  licensed payment institution with hubs in Germany, Spain and Finland.

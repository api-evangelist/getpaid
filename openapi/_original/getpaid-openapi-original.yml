components:
  securitySchemes:
    OAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.getpaid.io/oauth/token
          scopes:
            accounts:read: Allows to read accounts and onboarding applications.
            accounts:read_write: Allows to read, create and/or operate accounts and onboarding applications.
            payments:read: Allows to read payments and checkouts.
            payments:read_write: Allows to read, create and/or operate payments and checkouts.
  schemas:
    RequestAccessTokenRequest:
      type: object
      required:
        - client_id
        - client_secret
        - audience
        - grant_type
      properties:
        client_id:
          description: Your OAuth client ID for the environment, live or sandbox, you are requesting the token for.
          type: string
          example: g6gWu46zeP0HH4jkW3i22yJ2shDrNxJ8
        client_secret:
          description: Your OAuth client Secret for the environment, live or sandbox, you are requesting the token for.
          type: string
          example: S6gozTXzrS42OZ0cmxVJG133mOfuHhSfkIJkcH7FBm-0HyGrVZMLGJtyruTA4CQv
        audience:
          description: The API you wish to integrate with. Use this to switch between sandbox and live environment.
          type: string
          format: uri
          enum:
            - https://api.sandbox.getpaid.io
            - https://api.getpaid.io
        grant_type:
          description: The OAuth grant type.
          type: string
          const: client_credentials
    RequestAccessTokenResponse:
      type: object
      required:
        - access_token
        - scope
        - expires_in
        - token_type
      properties:
        access_token:
          description: The OAuth access token (JWT) used to authenticate to Getpaid API.
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        scope:
          description: The API scopes granted to the access token.
          type: string
          example: accounts:read documents:read_write payments:read
        expires_in:
          description: The duration (in seconds) until the access token expires.
          type: integer
          example: 86400
        token_type:
          description: The type of token returned.
          type: string
          enum:
            - Bearer
    ProblemDetailsBase:
      type: object
      description: The Problem Details JSON Object [[RFC7807](https://tools.ietf.org/html/rfc7807)].
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: A URI reference [[RFC3986](https://tools.ietf.org/html/rfc3986)] that identifies the problem type. It should provide human-readable documentation for the problem type. When this member is not present, its value is assumed to be "about:blank".
          format: uri
          example: https://docs.getpaid.io/ref/error-types#problem
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization.
          example: Invalid Request
        status:
          type: integer
          description: The HTTP status code.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: The request body was invalid
    ShortString:
      type: string
      minLength: 1
      maxLength: 50
    Reference:
      allOf:
        - $ref: '#/components/schemas/ShortString'
        - description: An identifier in your system. It is recommended to make it unique but the uniqueness is not enforced by the solution.
          example: ORD-202510-0232
    AmountMinor:
      type: integer
      format: amount-minor
      description: The payment amount in the minor currency unit (e.g. 100 cents for 1 EUR).
      example: 1000
    Currency:
      type: string
      format: currency
      minLength: 3
      maxLength: 3
      description: The processing currency code according to the [ISO-4217 standard](https://en.wikipedia.org/wiki/ISO_4217)
      example: EUR
    MediumString:
      type: string
      minLength: 1
      maxLength: 250
    CheckoutDescription:
      allOf:
        - $ref: '#/components/schemas/MediumString'
        - description: |
            A description of the checkout session.
            This will be visible to the buyer in the payment page but not in the bank or card statement.
          example: Order 202510-0232
    PaymentMethodType:
      description: The type of payment method.
      type: string
      enum:
        - card
        - sepa_direct_debit
    PaymentMethodBase:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PaymentMethodType'
    CardScheme:
      description: The card scheme.
      type: string
      enum:
        - visa
        - mastercard
    CardPaymentMethodDescriptor:
      allOf:
        - $ref: '#/components/schemas/PaymentMethodBase'
        - required:
            - scheme
          properties:
            scheme:
              $ref: '#/components/schemas/CardScheme'
    PaymentMethodDescriptor:
      description: A payment method.
      oneOf:
        - $ref: '#/components/schemas/PaymentMethodBase'
        - $ref: '#/components/schemas/CardPaymentMethodDescriptor'
      discriminator:
        propertyName: type
        mapping:
          card: '#/components/schemas/CardPaymentMethodDescriptor'
          sepa_direct_debit: '#/components/schemas/PaymentMethodBase'
    CardDynamicDescriptor:
      description: |
        The card dynamic descriptor.

        It will be prefixed with `GPD*` when displayed on the buyer statement. You don't need to include the `GPD*` prefix in the value sent.
      type: string
      pattern: ^[a-zA-Z0-9 *\._-]{1,18}$
      minLength: 1
      maxLength: 18
      example: TITAN*202510-0232
    CheckoutCardPaymentMethodOptions:
      description: Configuration options for card payment methods in the checkout.
      type: object
      required:
        - dynamic_descriptor
      properties:
        dynamic_descriptor:
          $ref: '#/components/schemas/CardDynamicDescriptor'
    SddRemittanceInfo:
      description: |
        The SEPA Direct Debit remittance information shown on the buyer statement.
      type: string
      minLength: 1
      maxLength: 140
      example: 'Titan Auto Parts Ord. #0232 Inv. #202500632'
    CheckoutSepaDirectDebitPaymentMethodOptions:
      description: Configuration options for SEPA Direct Debit payment methods in the checkout.
      type: object
      required:
        - remittance_info
      properties:
        remittance_info:
          $ref: '#/components/schemas/SddRemittanceInfo'
    CheckoutPaymentMethodsOptions:
      description: Configuration options for the payment methods available in the checkout.
      type: object
      properties:
        cards:
          $ref: '#/components/schemas/CheckoutCardPaymentMethodOptions'
        sepa_direct_debit:
          $ref: '#/components/schemas/CheckoutSepaDirectDebitPaymentMethodOptions'
    CheckoutExplicitPaymentMethodsRequest:
      type: object
      required:
        - type
        - available
      properties:
        type:
          description: The available payment methods selection method.
          type: string
        available:
          description: The list of payment methods to display in the checkout overriding the default methods.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PaymentMethodDescriptor'
        options:
          $ref: '#/components/schemas/CheckoutPaymentMethodsOptions'
    CheckoutDefaultPaymentMethodsRequest:
      type: object
      required:
        - type
      properties:
        type:
          description: The available payment methods selection method.
          type: string
        options:
          $ref: '#/components/schemas/CheckoutPaymentMethodsOptions'
    CheckoutPaymentMethodsRequest:
      description: |
        Configure payment methods for the checkout.

        - `explicit`: use `available` to provide the methods to display.
        - `default`: all available payment methods are selected automatically.
      anyOf:
        - $ref: '#/components/schemas/CheckoutExplicitPaymentMethodsRequest'
        - $ref: '#/components/schemas/CheckoutDefaultPaymentMethodsRequest'
      discriminator:
        propertyName: type
        mapping:
          explicit: '#/components/schemas/CheckoutExplicitPaymentMethodsRequest'
          default: '#/components/schemas/CheckoutDefaultPaymentMethodsRequest'
    SplitsType:
      description: The type of payment split.
      type: string
      enum:
        - per_transaction
    SplitsAccountType:
      description: |
        The type of account.

        Exactly one account of type `platform` and one of type `seller` are required and allowed per payment.
      type: string
      enum:
        - platform
        - seller
        - other
    Id:
      type: string
      format: id
      minLength: 30
      maxLength: 50
    AccountId:
      allOf:
        - $ref: '#/components/schemas/Id'
        - description: The unique identifier of the account.
          example: acc_44678r08jtm8zbt227tzhc4nw5
    SplitBaseAmount:
      type: object
      description: |
        The amount in payment currency to be allocated to this account.

        The sum of all split amounts for all accounts must be exactly the total amount of the payment
        or use the `remaining` type for one of the accounts to allocate the remaining amount after all
        other splits have been calculated.
      required:
        - type
      properties:
        type:
          type: string
          description: The type of split amount.
          enum:
            - fixed
            - percentage
            - remaining
    SplitAmountMinor:
      allOf:
        - description: The amount allocated to this account in the minor currency unit (e.g. 100 cents for 1 EUR).
        - $ref: '#/components/schemas/AmountMinor'
    SplitFixedAmount:
      allOf:
        - $ref: '#/components/schemas/SplitBaseAmount'
        - required:
            - amount
          properties:
            amount:
              $ref: '#/components/schemas/SplitAmountMinor'
    Percentage:
      type: number
      format: float
      minimum: 0
      maximum: 100
      multipleOf: 0.1
      example: 62.5
    SplitPercentageAmountRequest:
      allOf:
        - $ref: '#/components/schemas/SplitBaseAmount'
        - type: object
          required:
            - percentage
          properties:
            percentage:
              allOf:
                - $ref: '#/components/schemas/Percentage'
                - description: The percentage of the total amount to allocate to this account.
    SplitRemainingAmountRequest:
      allOf:
        - $ref: '#/components/schemas/SplitBaseAmount'
    ProcessingFeeRequest:
      description: |
        The processing fee covered by this account.

        If not specified, the account will not cover any processing fee.

        The sum of all processing fees covered by all accounts must be exactly 100%.
      type: object
      required:
        - percentage
      properties:
        percentage:
          allOf:
            - $ref: '#/components/schemas/Percentage'
            - description: The percentage of the total processing fee that this account will cover.
              example: 100
    SplitsRequest:
      description: |
        The list of payment splits for the accounts involved in the funds flow.

        See [how splits work](/monetize/splits) for more information.
      type: object
      required:
        - type
        - accounts
      properties:
        type:
          $ref: '#/components/schemas/SplitsType'
        accounts:
          description: The list of accounts involved in the payment that will receive the funds.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            description: A payment split account.
            type: object
            required:
              - type
              - id
              - split
            properties:
              type:
                $ref: '#/components/schemas/SplitsAccountType'
              id:
                $ref: '#/components/schemas/AccountId'
              split:
                description: The amount in the payment currency to be allocated to this account.
                oneOf:
                  - $ref: '#/components/schemas/SplitFixedAmount'
                  - $ref: '#/components/schemas/SplitPercentageAmountRequest'
                  - $ref: '#/components/schemas/SplitRemainingAmountRequest'
                discriminator:
                  propertyName: type
                  mapping:
                    fixed: '#/components/schemas/SplitFixedAmount'
                    percentage: '#/components/schemas/SplitPercentageAmountRequest'
                    remaining: '#/components/schemas/SplitRemainingAmountRequest'
              processing_fee:
                $ref: '#/components/schemas/ProcessingFeeRequest'
    Email:
      description: An email address.
      type: string
      format: email
      maxLength: 320
      example: jane.doe@company.com
    Country:
      type: string
      format: country
      minLength: 2
      maxLength: 2
      description: The two-letter [ISO 3166-1 alpha-2 country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
      example: DE
    AddressOptionalFields:
      type: object
      properties:
        line1:
          allOf:
            - $ref: '#/components/schemas/MediumString'
            - description: The first line of the address.
              example: Immermannstraße
        line2:
          allOf:
            - $ref: '#/components/schemas/MediumString'
            - description: The second line of the address.
              example: Haus 2, Wohnung 3A
        street_number:
          allOf:
            - $ref: '#/components/schemas/ShortString'
            - description: |
                The number assigned to the building on the street.
                May include alphanumeric formatting such as "7A" or "12-14". street number.
              example: '40'
        city:
          allOf:
            - $ref: '#/components/schemas/MediumString'
            - description: The city, town, municipality, or locality where the address is located.
              example: Düsseldorf
        region:
          allOf:
            - $ref: '#/components/schemas/MediumString'
            - description: The administrative area such as region, province, state, or county.
              example: Nordrhein-Westfalen
        postal_code:
          description: The postal code, postcode, or ZIP code used for mail delivery.
          type: string
          minLength: 1
          maxLength: 16
          example: '40210'
    CheckoutBuyerAddress:
      allOf:
        - description: |
            The buyer's address.

            **Required if the country of the seller account is Canada (CA).**
          properties:
            line1:
              type: string
            line2:
              type: string
            street_number:
              type: string
            city:
              type: string
            region:
              type: string
            postal_code:
              type: string
            country:
              allOf:
                - description: |
                    The country of the buyer's address in the form of a two-letter [ISO 3166-1 alpha-2 country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).

                    **Required if the country of the seller account is Canada (CA).**
                - $ref: '#/components/schemas/Country'
        - $ref: '#/components/schemas/AddressOptionalFields'
    CheckoutBuyerRequest:
      description: |
        Buyer details to pre-fill during checkout.

        **Required if the country of the seller account is Canada (CA).**
      type: object
      properties:
        first_name:
          allOf:
            - $ref: '#/components/schemas/ShortString'
            - description: The buyer's first name.
              example: Jane
        last_name:
          allOf:
            - $ref: '#/components/schemas/ShortString'
            - description: The buyer's last name.
              example: Doe
        email:
          allOf:
            - description: |
                The buyer's email address.

                **Required if the country of the seller account is Canada (CA).**
            - $ref: '#/components/schemas/Email'
        address:
          $ref: '#/components/schemas/CheckoutBuyerAddress'
        nationality:
          allOf:
            - description: The buyer's nationality in the form of a two-letter [ISO 3166-1 alpha-2 country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
              example: DE
            - $ref: '#/components/schemas/Country'
        business:
          description: The buyer's business details.
          properties:
            legal_name:
              allOf:
                - $ref: '#/components/schemas/MediumString'
                - description: The legal name of the business.
                  example: Motorbikes Düsseldorf GmbH
    StandingInstructionTerms:
      description: Terms for standing instructions of recurring payments.
      type: object
      required:
        - type
      properties:
        type:
          description: |
            Type of standing instruction.

            - `recurring`: periodic charges at a fixed frequency.
            - `unscheduled`: payments with no fixed schedule or frequency.
          type: string
          enum:
            - recurring
            - unscheduled
    InitialStandingInstructionRequest:
      description: Terms for a new standing instruction to gather the consent in the initial payment in a series of recurring payments.
      type: object
      required:
        - terms
      properties:
        terms:
          $ref: '#/components/schemas/StandingInstructionTerms'
    Url:
      type: string
      format: uri
      maxLength: 1024
    PaymentWebhooksRequest:
      description: Configuration for webhooks to receive payment status updates.
      type: object
      required:
        - url
      properties:
        url:
          allOf:
            - description: The URL to which webhook events will be sent.
              example: https://webhooks.titanauto.com/getpaid
            - $ref: '#/components/schemas/Url'
    CreateCheckoutRequest:
      type: object
      required:
        - reference
        - amount
        - currency
        - description
        - splits
        - redirect
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        amount:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          $ref: '#/components/schemas/CheckoutDescription'
        expires_in:
          description: Checkout expiration duration in HHHH:mm format, from 00:01 (1 minute) to 2160:00 (90 days).
          type: string
          pattern: ^\d{2,4}:[0-5]\d$
          minLength: 5
          maxLength: 7
          example: '01:30'
        payment_methods:
          $ref: '#/components/schemas/CheckoutPaymentMethodsRequest'
        splits:
          $ref: '#/components/schemas/SplitsRequest'
        buyer:
          $ref: '#/components/schemas/CheckoutBuyerRequest'
        standing_instruction:
          $ref: '#/components/schemas/InitialStandingInstructionRequest'
        redirect:
          description: Configuration for the redirect behavior after the payment is completed.
          required:
            - default
          properties:
            default:
              allOf:
                - $ref: '#/components/schemas/Url'
                - description: The URL to which the buyer will be redirected after the payment is completed (success or failure), if `completed` or `failed` are not provided.
                  example: https://titanauto.com/checkout/complete?order=202510-0232
            completed:
              allOf:
                - $ref: '#/components/schemas/Url'
                - description: The URL to which the buyer will be redirected if the payment results in success.
                  example: https://titanauto.com/checkout/complete?order=202510-0232
            failed:
              allOf:
                - $ref: '#/components/schemas/Url'
                - description: The URL to which the buyer will be redirected if the payment results in failure.
                  example: https://titanauto.com/checkout/payment-failed?order=202510-0232
        webhooks:
          $ref: '#/components/schemas/PaymentWebhooksRequest'
    CheckoutId:
      allOf:
        - $ref: '#/components/schemas/Id'
        - description: The unique identifier of the checkout.
          example: cko_4kf9v6xp00hzc99rdwr5m97wce
    CheckoutStatus:
      description: |
        The status of the checkout.
        See the [list, transitions, and description of each status](/payments/checkouts#lifecycle) for more details.
      type: string
      enum:
        - initiated
        - started
        - in_progress
        - completed
        - failed
        - expired
    DateTime:
      description: |
        UTC timestamp in ISO 8601 format with milliseconds ([RFC 3339](https://www.rfc-editor.org/rfc/rfc3339.html)).
        Always includes the 'Z' UTC indicator.
      type: string
      format: date-time
      minLength: 24
      maxLength: 24
      example: '2025-09-01T22:05:48.479Z'
    CreatedAt:
      allOf:
        - description: When the resource was created.
        - $ref: '#/components/schemas/DateTime'
    UpdatedAt:
      allOf:
        - description: When the resource was last updated.
        - $ref: '#/components/schemas/DateTime'
    CheckoutExpiresAt:
      allOf:
        - description: When the checkout session will expire if not completed.
        - $ref: '#/components/schemas/DateTime'
    CheckoutFlow:
      description: The flow required for the checkout to complete.
      type: object
      required:
        - next_step
      properties:
        next_step:
          description: The next step required to complete the flow.
          type: object
          required:
            - type
            - url
          properties:
            type:
              description: The type of the next step.
              type: string
              enum:
                - redirect
            url:
              allOf:
                - $ref: '#/components/schemas/Url'
                - description: The URL to redirect the buyer to complete the payment.
    CheckoutPaymentMethodsResponse:
      description: The payment methods of this checkout.
      type: object
      required:
        - type
        - available
      properties:
        type:
          description: The available payment methods selection method.
          type: string
          enum:
            - default
            - explicit
        available:
          description: The list of payment methods available for this checkout.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PaymentMethodDescriptor'
    Version:
      description: A resource version.
      type: string
      format: version
      minLength: 1
      maxLength: 50
      example: '2'
    AccountVersion:
      allOf:
        - description: The account version.
        - $ref: '#/components/schemas/Version'
    AccountLegalName:
      allOf:
        - description: The legal name of the account.
        - $ref: '#/components/schemas/MediumString'
    SplitPercentageAmountCalculated:
      allOf:
        - $ref: '#/components/schemas/SplitPercentageAmountRequest'
        - required:
            - amount
          properties:
            amount:
              $ref: '#/components/schemas/SplitAmountMinor'
    SplitRemainingAmountCalculated:
      allOf:
        - $ref: '#/components/schemas/SplitRemainingAmountRequest'
        - required:
            - amount
          properties:
            amount:
              $ref: '#/components/schemas/SplitAmountMinor'
    SplitsCalculated:
      description: |
        The list of payment splits for the accounts involved in the funds flow.

        The final split gross amounts have been calculated but processing fees are not included until the payment is captured.
      type: object
      required:
        - type
        - accounts
      properties:
        type:
          $ref: '#/components/schemas/SplitsType'
        accounts:
          description: The list of accounts involved in the payment that will receive the funds.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            description: A payment split account.
            type: object
            required:
              - type
              - id
              - version
              - legal_name
              - split
              - processing_fee
            properties:
              type:
                $ref: '#/components/schemas/SplitsAccountType'
              id:
                $ref: '#/components/schemas/AccountId'
              version:
                $ref: '#/components/schemas/AccountVersion'
              legal_name:
                $ref: '#/components/schemas/AccountLegalName'
              split:
                description: The amount in the payment currency to be allocated to this account.
                oneOf:
                  - $ref: '#/components/schemas/SplitFixedAmount'
                  - $ref: '#/components/schemas/SplitPercentageAmountCalculated'
                  - $ref: '#/components/schemas/SplitRemainingAmountCalculated'
                discriminator:
                  propertyName: type
                  mapping:
                    fixed: '#/components/schemas/SplitFixedAmount'
                    percentage: '#/components/schemas/SplitPercentageAmountCalculated'
                    remaining: '#/components/schemas/SplitRemainingAmountCalculated'
              processing_fee:
                $ref: '#/components/schemas/ProcessingFeeRequest'
    CreateCheckoutResponse:
      type: object
      required:
        - id
        - status
        - reference
        - created_at
        - updated_at
        - expires_at
        - flow
        - payment_methods
        - splits
      properties:
        id:
          $ref: '#/components/schemas/CheckoutId'
        status:
          $ref: '#/components/schemas/CheckoutStatus'
          const: initiated
        reference:
          $ref: '#/components/schemas/Reference'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        expires_at:
          $ref: '#/components/schemas/CheckoutExpiresAt'
        flow:
          $ref: '#/components/schemas/CheckoutFlow'
        payment_methods:
          $ref: '#/components/schemas/CheckoutPaymentMethodsResponse'
        splits:
          $ref: '#/components/schemas/SplitsCalculated'
    CheckoutIsExpired:
      type: boolean
      description: Indicates whether the checkout has expired. A checkout is considered expired when the current time has passed the `expires_at` timestamp.
      example: false
    CheckoutOriginBase:
      type: object
      required:
        - type
      properties:
        type:
          description: |
            The checkout origin type.

            - `api`: The checkout was created via the API.
          type: string
          enum:
            - api
    CheckoutOriginApi:
      allOf:
        - $ref: '#/components/schemas/CheckoutOriginBase'
    CheckoutOrigin:
      description: The origin of the checkout initiation.
      allOf:
        - $ref: '#/components/schemas/CheckoutOriginApi'
      discriminator:
        propertyName: type
        mapping:
          api: '#/components/schemas/CheckoutOriginApi'
    CheckoutPaymentMethodsAvailable:
      description: The payment methods of this checkout.
      type: object
      required:
        - type
        - available
      properties:
        type:
          description: The available payment methods selection method.
          type: string
          enum:
            - default
            - explicit
        available:
          description: The list of payment methods available for this checkout.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PaymentMethodDescriptor'
        options:
          $ref: '#/components/schemas/CheckoutPaymentMethodsOptions'
    StandingInstructionStatus:
      description: |
        The status of the standing instruction.

        - `new`: requested to creation as part of an initial payment.
        - `active`: standing instruction is active and can be used for subsequent payments.
      type: string
      enum:
        - new
        - active
    BaseStandingInstruction:
      type: object
      required:
        - status
        - terms
      properties:
        status:
          $ref: '#/components/schemas/StandingInstructionStatus'
        terms:
          $ref: '#/components/schemas/StandingInstructionTerms'
    NewStandingInstruction:
      allOf:
        - description: Details for a new standing instruction for recurring payments.
        - $ref: '#/components/schemas/BaseStandingInstruction'
    Index:
      description: The index of the element in the list.
      type: integer
      minimum: 0
      example: 0
    PaymentId:
      allOf:
        - $ref: '#/components/schemas/Id'
        - description: The unique identifier of the payment.
          example: pay_4a4m2pjycdb1jbj68h1rvk9kcz
    PaymentStatusPhase:
      description: |
        The phase of the payment, based on its status.

        - `in_progress`: The payment is being processed.
        - `completed`: The payment attempt completed successfully.
        - `failed`: The payment attempt was unsuccessful.
      type: string
      enum:
        - in_progress
        - completed
        - failed
    PaymentMethodDisplayHint:
      allOf:
        - description: A hint of the payment method used.
        - $ref: '#/components/schemas/ShortString'
    BasePaymentMethodDetails:
      allOf:
        - $ref: '#/components/schemas/PaymentMethodBase'
        - required:
            - display_hint
          properties:
            display_hint:
              $ref: '#/components/schemas/PaymentMethodDisplayHint'
    CardPaymentMethodDetails:
      allOf:
        - $ref: '#/components/schemas/BasePaymentMethodDetails'
        - required:
            - card
          properties:
            card:
              description: The card details.
              type: object
              required:
                - scheme
                - holder_name
                - first_digits
                - last_digits
                - expiry_month
                - expiry_year
              properties:
                scheme:
                  $ref: '#/components/schemas/CardScheme'
                holder_name:
                  description: The name of the cardholder as printed on the card.
                  type: string
                  minLength: 1
                  maxLength: 26
                  example: Jane Doe
                first_digits:
                  description: The first four to six digits of the card number (BIN) that identify the issuing bank.
                  type: string
                  minLength: 4
                  maxLength: 6
                  example: '424242'
                last_digits:
                  description: The last four digits of the card number.
                  type: string
                  minLength: 4
                  maxLength: 4
                  example: '4242'
                expiry_month:
                  description: The expiration month of the card.
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 12
                expiry_year:
                  description: The expiration year of the card.
                  type: integer
                  minimum: 2021
                  example: 2025
                kind:
                  description: Kind of the payment card.
                  type: string
                  enum:
                    - credit
                    - debit
                  example: credit
                segment:
                  description: Segment of the payment card.
                  type: string
                  enum:
                    - consumer
                    - corporate
                  example: consumer
    SddPaymentMethodDetails:
      allOf:
        - $ref: '#/components/schemas/BasePaymentMethodDetails'
        - required:
            - bank_account
          properties:
            bank_account:
              description: The bank account details.
              type: object
              required:
                - type
                - number
              properties:
                type:
                  description: The type of bank account.
                  type: string
                  enum:
                    - business
                    - consumer
                number:
                  description: The bank account number details.
                  type: object
                  required:
                    - type
                    - value
                  properties:
                    type:
                      description: The type of bank account number.
                      type: string
                      enum:
                        - iban
                    value:
                      description: The bank account number value.
                      type: string
                      minLength: 15
                      maxLength: 33
                      example: DE85100100100006992334
    PaymentMethodDetails:
      description: The payment method used.
      anyOf:
        - $ref: '#/components/schemas/CardPaymentMethodDetails'
        - $ref: '#/components/schemas/SddPaymentMethodDetails'
      discriminator:
        propertyName: type
        mapping:
          card: '#/components/schemas/CardPaymentMethodDetails'
          sepa_direct_debit: '#/components/schemas/SddPaymentMethodDetails'
    CheckoutPayments:
      description: The payments initiated as part of this checkout.
      type: array
      uniqueItems: true
      items:
        description: A payment initiated as part of this checkout.
        type: object
        required:
          - index
          - id
          - status
          - created_at
          - updated_at
          - method
        properties:
          index:
            $ref: '#/components/schemas/Index'
          id:
            $ref: '#/components/schemas/PaymentId'
          status:
            $ref: '#/components/schemas/PaymentStatusPhase'
          created_at:
            $ref: '#/components/schemas/CreatedAt'
          updated_at:
            $ref: '#/components/schemas/UpdatedAt'
          method:
            $ref: '#/components/schemas/PaymentMethodDetails'
    ThemeId:
      allOf:
        - $ref: '#/components/schemas/Id'
        - description: The unique identifier of the theme.
          example: thm_4jkgtzffbf9pzem7dgfhdeztwa
    ThemeRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/ThemeId'
        name:
          allOf:
            - $ref: '#/components/schemas/MediumString'
            - description: The name of the theme.
    CheckoutInitiatedStarted:
      type: object
      required:
        - id
        - status
        - reference
        - created_at
        - updated_at
        - expires_at
        - is_expired
        - amount
        - currency
        - flow
        - origin
        - payment_methods
        - splits
        - payments
        - theme
        - events
      properties:
        id:
          $ref: '#/components/schemas/CheckoutId'
        status:
          $ref: '#/components/schemas/CheckoutStatus'
        reference:
          $ref: '#/components/schemas/Reference'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        expires_at:
          $ref: '#/components/schemas/CheckoutExpiresAt'
        is_expired:
          $ref: '#/components/schemas/CheckoutIsExpired'
        amount:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          $ref: '#/components/schemas/CheckoutDescription'
        flow:
          $ref: '#/components/schemas/CheckoutFlow'
        origin:
          $ref: '#/components/schemas/CheckoutOrigin'
        payment_methods:
          $ref: '#/components/schemas/CheckoutPaymentMethodsAvailable'
        splits:
          $ref: '#/components/schemas/SplitsCalculated'
        standing_instruction:
          $ref: '#/components/schemas/NewStandingInstruction'
        payments:
          $ref: '#/components/schemas/CheckoutPayments'
        theme:
          allOf:
            - description: The theme used for the checkout.
            - $ref: '#/components/schemas/ThemeRef'
    CheckoutPaymentMethodsWithSelected:
      allOf:
        - required:
            - selected
          properties:
            type:
              type: string
            selected:
              $ref: '#/components/schemas/PaymentMethodDescriptor'
              description: The payment method selected by the buyer.
        - $ref: '#/components/schemas/CheckoutPaymentMethodsAvailable'
    CheckoutInProgress:
      type: object
      required:
        - id
        - status
        - reference
        - created_at
        - updated_at
        - expires_at
        - is_expired
        - amount
        - currency
        - flow

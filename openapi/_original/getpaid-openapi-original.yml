openapi: 3.1.0
info:
  title: Getpaid API
  version: v2
  contact:
    email: support@getpaid.io
  description: |
    # Getting started

    Our APIs provide programmatic access to the Getpaid solution. This page contains a comprehensive reference for all
    resources of the Getpaid public API. For walkthrough documentation please see [Getpaid guides](/) for step by step usage
    of the Getpaid platform including the API and [Getpaid API integration](/integration/api) for the technical aspects of
    this Getpaid API.

    To get started, book a demo and sign up at <https://getpaid.io>. This will give you access to the [Getpaid
    dashboard](https://dashboard.getpaid.io) where you can configure your account and retrieve your credentials needed to
    authenticate with Getpaid API.

    ## Postman

    Getpaid provides a Postman collection to test the API features in sandbox. You can [download the Postman collection and
    the environments](/integration/api/postman) to start testing the Getpaid API.

    ## Fields formats

    | Type | Format |
    | :- | :- |
    | `amount-minor` | Amount in the minor currency unit (e.g. 100 cents for 1 EUR). |
    | `country` | The country code fields follow the [ISO 3166-1 alpha-2 standard](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) in uppercase. Examples: `DE`, `US`. |
    | `currency` | The currency code fields follow the [ISO 4217 standard](https://en.wikipedia.org/wiki/ISO_4217) in uppercase. Examples: `EUR`, `USD`. |
    | `date` | Dates are formatted using the complete date format according to the [ISO 8601 standard](https://www.w3.org/TR/NOTE-datetime): `YYYY-MM-DD`. Example: `2023-09-30`.                                        |
    | `date-time` | Date-time fields are formatted using the [ISO 8601 standard](https://www.w3.org/TR/NOTE-datetime) for the combined date and time in UTC with 3 seconds fractional digits: `YYYY-MM-DDThh:mm:ss.SSSZ`. Example: `2015-09-01T23:59:59.479Z`. |
    | `date-time-offset` | Date-time fields with time-zone are formatted [ISO 8601 standard](https://www.w3.org/TR/NOTE-datetime) for the combined date and time with the time-zone and no second fractional digits: `YYYY-MM-DDThh:mm:ssTZD`. Example: `2015-09-01T23:59:59+01:00`. |
    | `email` | Email fields should follow the [RFC 5322](https://tools.ietf.org/html/rfc5322) standard. Example: `jon.smith@acme.com` |
    | `hex-color` | Colors are represented as a string starting with `#` followed by six hexadecimal digits. Each pair of digits represents the intensity of red, green, and blue components respectively. Examples: `#FFFFFF`, `#000000`, `#FF5733`. |
    | `id` | Identifiers are formatted as a string of 3 alphabetic characters (which represents the type of the identified object), one underscore and 26 alphanumeric characters. Every identifier generated in our system is globally unique. Examples: `acc_44678r08jtm8zbt227tzhc4nw5`, `doc_473cr1y0ghbyc3m1yfbwvn3nxx`. |
    | `ip-address` | IP fields are formatted using the [Internet Protocol version 4 (IPv4)](https://en.wikipedia.org/wiki/Internet_Protocol_version_4) standard: `x.x.x.x` where `x` must be a decimal value between `0` and `255`. Example: `192.158.1.38`. |
    | `version` | A resource version. For resources that can evolved over time, a unique reference of the snapshot used in other resource. For example, the account information used for a payment, the information used for the statement descriptor or the processing configuration are tighted to the version of the account. |
servers:
  - url: https://api.getpaid.io
    description: Live
  - url: https://api.sandbox.getpaid.io
    description: Sandbox
tags:
  - name: Authentication
    description: |
      <!-- markdownlint-disable link-fragments -->
      In order to authenticate with Getpaid API you need to request an OAuth 2.0 access token using your client ID and secret
      by calling the [Request access token endpoint](#tag/Authentication/operation/request_access_token).
      <!-- markdownlint-enable link-fragments -->

      Check full details on [how API authentication and authorization works](/integration/api/authentication/) and [how to get
      your client credentials](/integration/api/authentication/client-credentials).

      <!-- ReDoc-Inject: <security-definitions> -->
  - name: Checkouts
    description: Payment checkout sessions for one-time payments that the buyer can complete using Getpaid hosted checkout.
  - name: Payments
    description: |
      Create and manage payments initiated by the platform on behalf of the buyer.

      For recurring and unscheduled payments based on a previous standing instruction.
  - name: Accept payments webhooks
    description: Webhooks related to accepting payment events.
  - name: Applications
    description: Onboarding applications to collect the necessary information from sellers to create their Getpaid accounts and start accepting payments.
  - name: Accounts
    description: Getpaid accounts created for sellers so they can start accepting payments and receiving payouts.
  - name: Onboard sellers webhooks
    description: Webhooks related to onboarding and accounts events.
  - name: Queries
    description: List resources filtering and sorting them as needed.
paths:
  /oauth/token:
    post:
      tags:
        - Authentication
      summary: Request access token
      description: Obtain an OAuth 2.0 access token to authenticate API requests
      operationId: request_access_token
      servers:
        - url: https://auth.getpaid.io
          description: OAuth server
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAccessTokenRequest'
            examples:
              LiveAccessToken:
                $ref: '#/components/examples/LiveAccessToken'
              SandboxAccessToken:
                $ref: '#/components/examples/SandboxAccessToken'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestAccessTokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsBase'
  /v2/checkouts:
    post:
      tags:
        - Checkouts
      summary: Create a checkout
      description: |
        Create a payment checkout session.

        Related webhooks:

        - [`checkout_completed`](#tag/Accept-payments-webhooks/operation/checkout_completed): sent when the checkout process is completed with a successful payment.
        - [`checkout_failed`](#tag/Accept-payments-webhooks/operation/checkout_failed): sent when the checkout lifetime is reached without a successful payment attempt, and at least one payment was attempted but none were successful.
        - [`checkout_in_progress`](#tag/Accept-payments-webhooks/operation/checkout_in_progress): sent when the checkout lifetime reaches its expiration, but a payment attempt is still in progress.
        - [`checkout_unattempted`](#tag/Accept-payments-webhooks/operation/checkout_unattempted): sent when the checkout lifetime is reached without a payment.
        - For each payment attempt:
          - [`payment_captured`](#tag/Accept-payments-webhooks/operation/payment_captured): sent when the payment funds are captured and secured.
          - [`payment_failed`](#tag/Accept-payments-webhooks/operation/payment_failed): sent when a payment fails due to business (decline) or technical issues.
      operationId: create_checkout
      security:
        - OAuth:
            - payments:read_write
      parameters:
        - $ref: '#/components/parameters/GetpaidIdempotencyKey'
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutRequest'
            examples:
              CreateCheckout:
                $ref: '#/components/examples/CreateCheckout'
              CreateInitialRecurringCheckout:
                $ref: '#/components/examples/CreateInitialRecurringCheckout'
              CreateCheckoutExplicitMethods:
                $ref: '#/components/examples/CreateCheckoutExplicitMethods'
              CreateCheckoutBuyerDetails:
                $ref: '#/components/examples/CreateCheckoutBuyerDetails'
              CreateCheckoutCanada:
                $ref: '#/components/examples/CreateCheckoutCanada'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutResponse'
              examples:
                CheckoutCreated:
                  $ref: '#/components/examples/CheckoutCreated'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/checkouts/{checkout_id}:
    get:
      tags:
        - Checkouts
      summary: Get a checkout
      description: Retrieve a payment checkout session.
      operationId: get_checkout
      security:
        - OAuth:
            - payments:read
        - OAuth:
            - payments:read_write
      parameters:
        - name: checkout_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CheckoutId'
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCheckoutResponse'
              examples:
                CheckoutCompleted:
                  $ref: '#/components/examples/CheckoutCompleted'
                CheckoutInitiated:
                  $ref: '#/components/examples/CheckoutInitiated'
                CheckoutStarted:
                  $ref: '#/components/examples/CheckoutStarted'
                CheckoutInProgress:
                  $ref: '#/components/examples/CheckoutInProgress'
                CheckoutFailed:
                  $ref: '#/components/examples/CheckoutFailed'
                CheckoutExpired:
                  $ref: '#/components/examples/CheckoutExpired'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/checkouts/query:
    post:
      tags:
        - Checkouts
      summary: Query checkouts
      description: |
        Query checkouts filtering, and sorting and paginating results.

        See [Query resources](#tag/Queries/operation/query_resources) for more examples and details
        about other resources, pagination and everything related to operate the Getpaid solution.
      operationId: query_checkouts
      security:
        - OAuth:
            - payments:read
      parameters:
        - $ref: '#/components/parameters/GetpaidIdempotencyKey'
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryCheckoutsRequest'
            examples:
              QueryPayments:
                $ref: '#/components/examples/QueryCheckouts'
        required: true
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryCheckoutsResponse'
              examples:
                FilteredCheckouts:
                  $ref: '#/components/examples/FilteredCheckouts'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/payments:
    post:
      tags:
        - Payments
      summary: Create a payment
      description: |
        Create a payment initiated by the platform on behalf of a buyer.

        Related webhooks:

        - [`payment_captured`](#tag/Accept-payments-webhooks/operation/payment_captured): sent when the payment funds are captured and secured.
        - [`payment_failed`](#tag/Accept-payments-webhooks/operation/payment_failed): sent when a payment fails due to business (decline) or technical issues.
      operationId: create_payment
      security:
        - OAuth:
            - payments:read_write
      parameters:
        - $ref: '#/components/parameters/GetpaidIdempotencyKey'
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              CreateSubsequentPayment:
                $ref: '#/components/examples/CreateSubsequentPayment'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePaymentResponse'
              examples:
                PaymentCreated:
                  $ref: '#/components/examples/PaymentCreated'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/payments/{payment_id}:
    get:
      tags:
        - Payments
      summary: Get a payment
      description: Retrieve a payment.
      operationId: get_payment
      security:
        - OAuth:
            - payments:read
        - OAuth:
            - payments:read_write
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PaymentId'
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPaymentResponse'
              examples:
                CompletePayment:
                  $ref: '#/components/examples/CompletePayment'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/payments/{payment_id}/refunds:
    post:
      tags:
        - Payments
      summary: Refund a payment
      description: |
        Refund a captured payment fully or partially.

        Related webhooks:

        - [`payment_refunded`](#tag/Accept-payments-webhooks/operation/payment_refunded): sent when the funds are returned to the buyer.
        - [`payment_refund_failed`](#tag/Accept-payments-webhooks/operation/payment_refund_failed): sent when a refund process fails due to business or technical issues.
      operationId: refund_payment
      security:
        - OAuth:
            - payments:read_write
      parameters:
        - name: payment_id
          in: path
          description: The ID of the payment to refund.
          required: true
          schema:
            $ref: '#/components/schemas/PaymentId'
        - $ref: '#/components/parameters/GetpaidIdempotencyKey'
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
            examples:
              CreateFullRefund:
                $ref: '#/components/examples/CreateFullRefund'
              CreatePartialRefund:
                $ref: '#/components/examples/CreatePartialRefund'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundPaymentResponse'
              examples:
                FullRefundCreated:
                  $ref: '#/components/examples/FullRefundCreated'
                PartialRefundCreated:
                  $ref: '#/components/examples/PartialRefundCreated'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/payments/query:
    post:
      tags:
        - Payments
      summary: Query payments
      description: |
        Query payments filtering, and sorting and paginating results.

        See [Query resources](#tag/Queries/operation/query_resources) for more examples and details
        about other resources, pagination and everything related to operate the Getpaid solution.
      operationId: query_payments
      security:
        - OAuth:
            - payments:read
      parameters:
        - $ref: '#/components/parameters/GetpaidIdempotencyKey'
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryPaymentsRequest'
            examples:
              QueryPayments:
                $ref: '#/components/examples/QueryPayments'
        required: true
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryPaymentsResponse'
              examples:
                FilteredPayments:
                  $ref: '#/components/examples/FilteredPayments'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/accounts/query:
    post:
      tags:
        - Accounts
      summary: Query accounts
      description: |
        Query accounts filtering, sorting and paginating results.

        See [Queries](/operate/queries) for more examples and details about pagination and common query patterns.
      operationId: query_accounts
      security:
        - OAuth:
            - accounts:read
      parameters:
        - $ref: '#/components/parameters/GetpaidIdempotencyKey'
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryAccountsRequest'
            examples:
              QueryAccounts:
                $ref: '#/components/examples/QueryAccounts'
        required: true
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryAccountsResponse'
              examples:
                FilteredAccounts:
                  $ref: '#/components/examples/FilteredAccounts'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/accounts/{account_id}/themes:
    get:
      tags:
        - Accounts
      summary: Get account themes
      description: |
        Retrieve the themes configured for an account.

        Sellers can retrieve themes they own. Platforms can retrieve themes for sellers they own.
      operationId: get_account_themes
      security:
        - OAuth:
            - accounts:read
      parameters:
        - name: account_id
          in: path
          description: The ID of the account whose themes should be retrieved.
          required: true
          schema:
            $ref: '#/components/schemas/AccountId'
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetThemesResponse'
              examples:
                AccountThemes:
                  $ref: '#/components/examples/AccountThemes'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/applications:
    post:
      tags:
        - Applications
      summary: Create an application
      description: |
        Create an application initiated by the platform so the seller can start submitting their information. It can be:

        - `onboarding`: to create a new account for the seller and start accepting payments.
        - `change_request`: to update an existing seller account with new information.

        Related webhooks:

        - [`application_submitted`](#tag/Onboard-sellers-webhooks/operation/application_submitted): sent when an application is submitted by a seller for review.
        - [`application_completed`](#tag/Onboard-sellers-webhooks/operation/application_completed): sent when the application is approved and completed.
      operationId: create_application
      security:
        - OAuth:
            - accounts:read_write
      parameters:
        - $ref: '#/components/parameters/GetpaidIdempotencyKey'
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            examples:
              CreateApplication:
                $ref: '#/components/examples/CreateApplication'
              CreateApplicationSellerDetails:
                $ref: '#/components/examples/CreateApplicationSellerDetails'
              CreateApplicationCanada:
                $ref: '#/components/examples/CreateApplicationCanada'
              CreateApplicationCanadaSellerDetails:
                $ref: '#/components/examples/CreateApplicationSellerDetailsCanada'
              CreateChangeRequestApplication:
                $ref: '#/components/examples/CreateChangeRequestApplication'
              CreateChangeRequestApplicationWithTheme:
                $ref: '#/components/examples/CreateChangeRequestApplicationWithTheme'
        required: true
      responses:
        '201':
          description: Created
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationResponse'
              examples:
                ApplicationCreated:
                  $ref: '#/components/examples/ApplicationCreated'
                ChangeRequestApplicationCreated:
                  $ref: '#/components/examples/ChangeRequestApplicationCreated'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/applications/{application_id}:
    get:
      tags:
        - Applications
      summary: Get an application
      description: |
        Retrieve details of an application by its ID. Both `onboarding` and `change_request` applications can be retrieved.
      operationId: get_application
      security:
        - OAuth:
            - accounts:read
      parameters:
        - name: application_id
          in: path
          description: The ID of the application to retrieve.
          required: true
          schema:
            $ref: '#/components/schemas/ApplicationId'
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApplicationResponse'
              examples:
                ApplicationInitiated:
                  $ref: '#/components/examples/ApplicationInitiated'
                ApplicationCompleted:
                  $ref: '#/components/examples/ApplicationCompleted'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/applications/{application_id}/refresh:
    post:
      tags:
        - Applications
      summary: Refresh an application
      description: |
        Extends the lifespan of an application so the seller can continue submitting their information. Both `onboarding` and `change_request` applications can be refreshed.
      operationId: refresh_application
      security:
        - OAuth:
            - accounts:read_write
      parameters:
        - name: application_id
          in: path
          description: The ID of the application to refresh.
          required: true
          schema:
            $ref: '#/components/schemas/ApplicationId'
        - $ref: '#/components/parameters/GetpaidIdempotencyKey'
          required: true
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshApplicationResponse'
              examples:
                ApplicationRefreshed:
                  $ref: '#/components/examples/ApplicationRefreshed'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/applications/{application_id}/cancel:
    post:
      tags:
        - Applications
      summary: Cancel an application
      description: |
        Cancels a duplicate or abandoned application. Both `onboarding` and `change_request` applications can be cancelled.

        Applications in `approved`, `completed`, or already `cancelled` status cannot be cancelled and return a validation error.

        The response returns the updated application with `status` set to `cancelled` and the hosted flow cleared. For change requests, cancellation closes the open workflow so a new change request can be created for the same seller account.
      operationId: cancel_application
      security:
        - OAuth:
            - accounts:read_write
      parameters:
        - name: application_id
          in: path
          description: The ID of the application to cancel.
          required: true
          schema:
            $ref: '#/components/schemas/ApplicationId'
        - $ref: '#/components/parameters/GetpaidIdempotencyKey'
          required: true
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApplicationResponse'
              examples:
                OnboardingApplicationCancelled:
                  $ref: '#/components/examples/OnboardingApplicationCancelled'
                ChangeRequestApplicationCancelled:
                  $ref: '#/components/examples/ChangeRequestApplicationCancelled'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/applications/query:
    post:
      tags:
        - Applications
      summary: Query applications
      description: |
        Query applications filtering, sorting and paginating results. Both `onboarding` and `change_request` applications are returned.

        See [Queries](/operate/queries) for more examples and details about pagination and common query patterns.
      operationId: query_applications
      security:
        - OAuth:
            - accounts:read
      parameters:
        - $ref: '#/components/parameters/GetpaidIdempotencyKey'
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryApplicationsRequest'
            examples:
              QueryApplications:
                $ref: '#/components/examples/QueryApplications'
        required: true
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryApplicationsResponse'
              examples:
                FilteredApplications:
                  $ref: '#/components/examples/FilteredApplications'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
  /v2/{resource_type}/query:
    post:
      tags:
        - Queries
      summary: Query resources
      description: |
        Query Getpaid solution resources obtaining specific data by filtering and retrieving each resource type:

        - `checkouts` - [Query checkouts](#tag/Checkouts/operation/query_checkouts)
        - `payments` - [Query payments](#tag/Payments/operation/query_payments)
      operationId: query_resources
      security:
        - OAuth:
            - payments:read
      parameters:
        - name: resource_type
          in: path
          description: The type of the resources to query.
          required: true
          schema:
            $ref: '#/components/schemas/QueriesResourceType'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryResourcesRequest'
            examples:
              QueryCheckouts:
                $ref: '#/components/examples/QueryCheckouts'
              QueryPayments:
                $ref: '#/components/examples/QueryPayments'
              QueryNext20Payments:
                $ref: '#/components/examples/QueryNext20Payments'
        required: true
      responses:
        '200':
          description: OK
          headers:
            Getpaid-Trace-Id:
              $ref: '#/components/headers/GetpaidTraceId'
              required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResourcesResponse'
              examples:
                FilteredPayments:
                  $ref: '#/components/examples/FilteredPayments'
                FilteredCheckouts:
                  $ref: '#/components/examples/FilteredCheckouts'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '422':
          $ref: '#/components/responses/422InvalidParameters'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
webhooks:
  checkout_completed:
    post:
      summary: checkout_completed
      operationId: checkout_completed
      description: The `checkout_completed` webhook is sent when the checkout process is completed with a successful payment.
      tags:
        - Accept payments webhooks
      security: []
      parameters:
        - $ref: '#/components/parameters/GetpaidTraceId'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookBaseRequest'
                - properties:
                    type:
                      const: checkout_completed
                    data:
                      type: object
                      required:
                        - id
                        - origin
                        - reference
                        - payment
                      properties:
                        id:
                          $ref: '#/components/schemas/CheckoutId'
                        origin:
                          $ref: '#/components/schemas/PaymentOrigin'
                        reference:
                          $ref: '#/components/schemas/Reference'
                        payment:
                          description: The successful payment associated with the completed checkout.
                          type: object
                          required:
                            - id
                          properties:
                            id:
                              $ref: '#/components/schemas/PaymentId'
                            standing_instruction:
                              description: The standing instruction associated with the payment, if the payment is the first of a recurring series.
                              required:
                                - id
                                - status
                              properties:
                                id:
                                  $ref: '#/components/schemas/StandingInstructionId'
                                status:
                                  allOf:
                                    - $ref: '#/components/schemas/StandingInstructionStatus'
                                    - const: active
                                      example: active
      responses:
        '429':
          description: The webhook action will be retried according to the workflow retry schedule
        2XX:
          description: Indicate success, the webhook will not be retried
        4XX:
          description: The webhook action will be disabled
        5XX:
          description: The webhook action will be retried according to the workflow retry schedule
  checkout_failed:
    post:
      summary: checkout_failed
      operationId: checkout_failed
      description: |
        The `checkout_failed` webhook is sent when the checkout lifetime is reached without a successful payment attempt, and at least one payment was attempted but none were successful.

        It can be received days after the checkout is created depending on the payment method selected.
      tags:
        - Accept payments webhooks
      security: []
      parameters:
        - $ref: '#/components/parameters/GetpaidTraceId'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookBaseRequest'
                - properties:
                    type:
                      const: checkout_failed
                    data:
                      type: object
                      required:
                        - id
                        - origin
                        - reference
                        - payment
                      properties:
                        id:
                          $ref: '#/components/schemas/CheckoutId'
                        origin:
                          $ref: '#/components/schemas/PaymentOrigin'
                        reference:
                          $ref: '#/components/schemas/Reference'
                        payment:
                          allOf:
                            - $ref: '#/components/schemas/WebhookCheckoutPayment'
                            - description: The last payment failed associated with the checkout.
      responses:
        '429':
          description: The webhook action will be retried according to the workflow retry schedule
        2XX:
          description: Indicate success, the webhook will not be retried
        4XX:
          description: The webhook action will be disabled
        5XX:
          description: The webhook action will be retried according to the workflow retry schedule
  checkout_in_progress:
    post:
      summary: checkout_in_progress
      operationId: checkout_in_progress
      description: |
        The `checkout_in_progress` webhook is sent when the checkout lifetime reaches its expiration, but a payment attempt is still in progress.

        Banking payment methods are typical examples where this webhook can be sent, as the payment processing can take several days depending on the bank processing times.
      tags:
        - Accept payments webhooks
      security: []
      parameters:
        - $ref: '#/components/parameters/GetpaidTraceId'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookBaseRequest'
                - properties:
                    type:
                      const: checkout_in_progress
                    data:
                      type: object
                      required:
                        - id
                        - origin
                        - reference
                        - payment
                      properties:
                        id:
                          $ref: '#/components/schemas/CheckoutId'
                        origin:
                          $ref: '#/components/schemas/PaymentOrigin'
                        reference:
                          $ref: '#/components/schemas/Reference'
                        payment:
                          allOf:
                            - $ref: '#/components/schemas/WebhookCheckoutPayment'
                            - description: The payment in progress pending to be confirmed its final status and associated with the checkout.
                              type: object
                              properties:
                                estimated_update_before:
                                  description: The estimated UTC datetime before which the payment status is expected to be updated.
                                  allOf:
                                    - $ref: '#/components/schemas/DateTime'
      responses:
        '429':
          description: The webhook action will be retried according to the workflow retry schedule
        2XX:
          description: Indicate success, the webhook will not be retried
        4XX:
          description: The webhook action will be disabled
        5XX:
          description: The webhook action will be retried according to the workflow retry schedule
  checkout_unattempted:
    post:

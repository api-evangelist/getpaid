          completed: '#/components/schemas/CheckoutCompleted'
          failed: '#/components/schemas/CheckoutFailed'
          expired: '#/components/schemas/CheckoutExpired'
    PaginationFirst:
      description: Pagination. The number of elements that will be retrieved.
      type: integer
      default: 20
      minimum: 1
      maximum: 100
    PaginationAfter:
      description: Pagination. The `cursor` from next page will be retrieved.
      type: string
      maxLength: 250
    BaseSortsRequest:
      description: Fields to sort the data by. If not set, the data will be sorted by the creation date descending.
      type: array
      minItems: 1
      uniqueItems: true
      items:
        description: Each field to sort by.
        type: object
        required:
          - field
          - direction
        properties:
          field:
            description: The field to sort by. Each field available can only be used once in the list.
            type: string
          direction:
            description: The sort direction
            type: string
            enum:
              - ascending
              - descending
    BaseQueryRequest:
      type: object
      properties:
        type:
          description: |
            The type of the Getpaid solution resources to query.

            Some query endpoints infer the resource type from the request path. In those cases, if this field is set, it
            must match the resource targeted by the request URL.
          type: string
        first:
          allOf:
            - $ref: '#/components/schemas/PaginationFirst'
        after:
          $ref: '#/components/schemas/PaginationAfter'
        filters:
          description: Filters to reduce the data set to query. If not set, all resources available of the given type will be queried.
        sorts:
          $ref: '#/components/schemas/BaseSortsRequest'
    CheckoutsFiltersRequest:
      description: Filtering checkouts.
      type: object
      properties:
        id:
          allOf:
            - description: The checkout identifier to filter by using an exact match operation.
            - $ref: '#/components/schemas/CheckoutId'
        reference:
          description: The checkout reference to filter by using a contains operation.
          type: string
        seller_legal_name:
          description: The seller legal name to filter by using a contains operation.
          type: string
        statuses:
          description: The list of checkout statuses to filter by.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CheckoutStatus'
    BaseSortItemRequest:
      description: Each field to sort by.
      type: object
      required:
        - field
        - direction
      properties:
        field:
          description: The field to sort by. Each field available can only be used once in the list.
          type: string
        direction:
          description: The sort direction
          type: string
          enum:
            - ascending
            - descending
    CheckoutsSortsRequest:
      description: Fields to sort the data by. If not set, the data will be sorted by the creation date descending.
      type: array
      minItems: 1
      uniqueItems: true
      items:
        allOf:
          - $ref: '#/components/schemas/BaseSortItemRequest'
          - properties:
              field:
                enum:
                  - created_at
                  - amount
                  - seller_legal_name
    QueryCheckoutsRequest:
      allOf:
        - $ref: '#/components/schemas/BaseQueryRequest'
        - required:
            - type
          properties:
            type:
              type: string
              enum:
                - checkouts
            filters:
              $ref: '#/components/schemas/CheckoutsFiltersRequest'
            sorts:
              $ref: '#/components/schemas/CheckoutsSortsRequest'
    QueryPaymentMethodHint:
      description: The payment method used in a checkout.
      type: object
      required:
        - type
      properties:
        type:
          description: The type of payment method.
          type: string
          enum:
            - card
            - sepa_direct_debit
        scheme:
          description: The scheme of the payment method (e.g., visa, mastercard).
          type: string
    SellerRef:
      description: A reference to the seller account.
      type: object
      required:
        - id
        - legal_name
      properties:
        id:
          $ref: '#/components/schemas/AccountId'
        legal_name:
          $ref: '#/components/schemas/AccountLegalName'
    PartyRef:
      description: A reference to a party account involved in the transaction.
      type: object
      required:
        - id
        - type
        - legal_name
      properties:
        id:
          $ref: '#/components/schemas/AccountId'
        type:
          description: The type of party.
          type: string
          enum:
            - platform
            - other
        legal_name:
          $ref: '#/components/schemas/AccountLegalName'
    PaginationCursor:
      description: The cursor to the last item. If non-empty, can be used to fetch the next page. If not set, there is no more elements.
      type: string
      maxLength: 250
      example: Q3VyaW9zaXR5IEtpbGxlZCB0aGUgQ2F0Cg==
    PaginationData:
      description: The list of queried elements.
      type: array
      items:
        type: object
    PaginatedResponse:
      type: object
      required:
        - data
      properties:
        cursor:
          $ref: '#/components/schemas/PaginationCursor'
        data:
          $ref: '#/components/schemas/PaginationData'
    QueryCheckoutsResponse:
      allOf:
        - required:
            - type
          properties:
            type:
              type: string
              enum:
                - checkouts
            cursor:
              type: string
            data:
              items:
                required:
                  - id
                  - reference
                  - status
                  - amount
                  - currency
                  - created_at
                  - updated_at
                  - expires_at
                  - payment_methods
                  - seller
                  - parties
                properties:
                  id:
                    $ref: '#/components/schemas/CheckoutId'
                  reference:
                    $ref: '#/components/schemas/Reference'
                  status:
                    $ref: '#/components/schemas/CheckoutStatus'
                  amount:
                    $ref: '#/components/schemas/AmountMinor'
                  currency:
                    $ref: '#/components/schemas/Currency'
                  created_at:
                    $ref: '#/components/schemas/CreatedAt'
                  updated_at:
                    $ref: '#/components/schemas/UpdatedAt'
                  expires_at:
                    $ref: '#/components/schemas/CheckoutExpiresAt'
                  payment_methods:
                    description: The list of payment methods available in the checkout.
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/QueryPaymentMethodHint'
                  seller:
                    $ref: '#/components/schemas/SellerRef'
                  parties:
                    description: The list of parties involved in the transaction.
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/PartyRef'
        - $ref: '#/components/schemas/PaginatedResponse'
    BasePaymentMethodRequest:
      description: The payment method configuration for this payment.
      type: object
      required:
        - type
      properties:
        type:
          description: The payment method type.
          type: string
    CardPaymentMethodRequest:
      allOf:
        - $ref: '#/components/schemas/BasePaymentMethodRequest'
        - type: object
          required:
            - dynamic_descriptor
          properties:
            dynamic_descriptor:
              $ref: '#/components/schemas/CardDynamicDescriptor'
    SddPaymentMethodRequest:
      allOf:
        - $ref: '#/components/schemas/BasePaymentMethodRequest'
        - type: object
          required:
            - remittance_info
          properties:
            type:
              description: The payment method type.
              type: string
            remittance_info:
              $ref: '#/components/schemas/SddRemittanceInfo'
    PaymentMethodRequest:
      description: The payment method configuration for this payment.
      anyOf:
        - $ref: '#/components/schemas/CardPaymentMethodRequest'
        - $ref: '#/components/schemas/SddPaymentMethodRequest'
      discriminator:
        propertyName: type
        mapping:
          card: '#/components/schemas/CardPaymentMethodRequest'
          sepa_direct_debit: '#/components/schemas/SddPaymentMethodRequest'
    SubsequentStandingInstructionRequest:
      description: Standing instruction for recurring payments.
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/StandingInstructionId'
    CreatePaymentRequest:
      type: object
      required:
        - reference
        - amount
        - currency
        - splits
        - standing_instruction
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        amount:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        method:
          $ref: '#/components/schemas/PaymentMethodRequest'
        splits:
          $ref: '#/components/schemas/SplitsRequest'
        standing_instruction:
          $ref: '#/components/schemas/SubsequentStandingInstructionRequest'
        webhooks:
          $ref: '#/components/schemas/PaymentWebhooksRequest'
    PaymentStatus:
      description: |
        The status of the payment.
        See the [list, transitions, and description of each status](/payments/lifecycle) for more details.
      type: string
      enum:
        - initiated
        - action_required
        - submitted
        - authorized
        - captured
        - declined
        - failed
        - partially_refunded
        - refunded
    ReasonBase:
      description: Reason of the status of the resource when it requires additional steps or is a failure state.
      type: object
      required:
        - code
        - description
      properties:
        code:
          description: Code to identify the cause of the status of the resource.
          type: string
        description:
          description: Human-readable description of the reason for the status of the resource.
          type: string
    PaymentReason:
      allOf:
        - description: |
            The reason for the payment status when it requires additional steps or is a failure state.
            See all the [possible payment reasons for each status](/payments/lifecycle/reason-codes) for more details.
          properties:
            code:
              description: |
                Code to identify the cause of the payment status.
                See all the [possible payment reason codes for each status](/payments/lifecycle/reason-codes) for more details.
            description:
              description: Human-readable description of the reason for the payment status.
        - $ref: '#/components/schemas/ReasonBase'
    StatementDescriptorResponse:
      description: |
        The final statement descriptor shown on the buyer statement.

        This value is calculated per payment method:

        - **Cards**: `dynamic_descriptor` with the `GPD*` prefix.
        - **SEPA Direct Debit**: `remittance_info`.
      type: string
      minLength: 1
      maxLength: 140
      example: GPD*TITAN*202510-0232
    ProcessingFeeCalculating:
      allOf:
        - $ref: '#/components/schemas/ProcessingFeeRequest'
        - properties:
            amount:
              $ref: '#/components/schemas/ProcessingFeeAmount'
    SplitsCalculatedAndCalculatingFees:
      description: |
        The list of payment splits for the accounts involved in the funds flow.

        The final split amounts and processing fees have been calculated.
      type: object
      required:
        - type
        - accounts
      properties:
        type:
          $ref: '#/components/schemas/SplitsType'
        accounts:
          description: The list of accounts involved in the payment that will receive the funds.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            description: A payment split account.
            type: object
            required:
              - type
              - id
              - version
              - legal_name
              - split
              - processing_fee
            properties:
              type:
                $ref: '#/components/schemas/SplitsAccountType'
              id:
                $ref: '#/components/schemas/AccountId'
              version:
                $ref: '#/components/schemas/AccountVersion'
              legal_name:
                $ref: '#/components/schemas/AccountLegalName'
              split:
                description: The amount in the payment currency to be allocated to this account.
                oneOf:
                  - $ref: '#/components/schemas/SplitFixedAmount'
                  - $ref: '#/components/schemas/SplitPercentageAmountCalculated'
                  - $ref: '#/components/schemas/SplitRemainingAmountCalculated'
                discriminator:
                  propertyName: type
                  mapping:
                    fixed: '#/components/schemas/SplitFixedAmount'
                    percentage: '#/components/schemas/SplitPercentageAmountCalculated'
                    remaining: '#/components/schemas/SplitRemainingAmountCalculated'
              processing_fee:
                $ref: '#/components/schemas/ProcessingFeeCalculating'
    PaymentAuthentication:
      description: Information about the authentication performed for the payment if any.
      type: object
      required:
        - type
        - status
      properties:
        type:
          description: The type of authentication performed for the payment.
          type: string
          enum:
            - 3ds
        status:
          description: |
            The status of the authentication.

            - `succeeded`: the authentication was successful.
            - `failed`: the authentication failed.
          type: string
          enum:
            - succeeded
            - failed
        result:
          description: The 3DS authentication result.
          type: object
          required:
            - code
            - eci
          properties:
            code:
              description: The 3DS authentication result code.
              type: string
              minLength: 1
              maxLength: 1
              enum:
                - 'Y'
                - A
                - 'N'
                - U
                - R
            eci:
              description: The Electronic Commerce Indicator (ECI) value for the authentication.
              type: string
              minLength: 2
              maxLength: 2
              enum:
                - '05'
                - '06'
                - '07'
                - '01'
                - '02'
                - '03'
    PaymentTotals:
      description: The payment totals summary to provide an overview of captured, refunded, refundable amounts and processing fees overall and per account associated with the payment.
      type: object
      required:
        - net
        - captured
        - refunded
        - refundable
        - processing_fees
        - accounts
      properties:
        net:
          allOf:
            - description: The net amount for the payment that includes the captured funds and refunded amounts and processing fees deductions in the minor currency unit (e.g. 100 cents for 1 EUR).
            - $ref: '#/components/schemas/AmountMinor'
        captured:
          allOf:
            - description: The total amount captured for the payment in the minor currency unit (e.g. 100 cents for 1 EUR).
            - $ref: '#/components/schemas/AmountMinor'
        refunded:
          allOf:
            - description: The total amount refunded for the payment in the minor currency unit (e.g. 100 cents for 1 EUR).
            - $ref: '#/components/schemas/AmountMinor'
        refundable:
          allOf:
            - description: The amount that can be still be refunded for the payment in the minor currency unit (e.g. 100 cents for 1 EUR).
            - $ref: '#/components/schemas/AmountMinor'
        processing_fees:
          allOf:
            - description: The total processing fees that include captures and refunds fees in the minor currency unit (e.g. 100 cents for 1 EUR).
            - $ref: '#/components/schemas/AmountMinor'
        accounts:
          description: The breakdown of totals per account associated with the payment.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: object
            required:
              - type
              - id
              - version
              - legal_name
              - net
              - captured
              - refunded
              - refundable
              - processing_fees
            properties:
              type:
                description: The type of account.
                type: string
                enum:
                  - seller
                  - platform
              id:
                $ref: '#/components/schemas/AccountId'
              version:
                $ref: '#/components/schemas/AccountVersion'
              legal_name:
                $ref: '#/components/schemas/AccountLegalName'
              net:
                allOf:
                  - description: The net amount for the account including their split for the captured funds and deducting their refunded splits and processing fees the account is covering in the minor currency unit (e.g. 100 cents for 1 EUR).
                  - $ref: '#/components/schemas/AmountMinor'
              captured:
                allOf:
                  - description: The total amount captured for this account in the minor currency unit (e.g. 100 cents for 1 EUR).
                  - $ref: '#/components/schemas/AmountMinor'
              refunded:
                allOf:
                  - description: The total amount refunded for this account in the minor currency unit (e.g. 100 cents for 1 EUR).
                  - $ref: '#/components/schemas/AmountMinor'
              refundable:
                allOf:
                  - description: The total refundable amount for this account in the minor currency unit (e.g. 100 cents for 1 EUR).
                  - $ref: '#/components/schemas/AmountMinor'
              processing_fees:
                allOf:
                  - description: The total processing fees covered by this account in the minor currency unit (e.g. 100 cents for 1 EUR).
                  - $ref: '#/components/schemas/AmountMinor'
    CreatePaymentResponse:
      type: object
      required:
        - id
        - status
        - reference
        - created_at
        - updated_at
        - method
        - splits
        - totals
      properties:
        id:
          $ref: '#/components/schemas/PaymentId'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        reason:
          $ref: '#/components/schemas/PaymentReason'
        reference:
          $ref: '#/components/schemas/Reference'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        statement_descriptor:
          $ref: '#/components/schemas/StatementDescriptorResponse'
        method:
          $ref: '#/components/schemas/PaymentMethodDetails'
        splits:
          $ref: '#/components/schemas/SplitsCalculatedAndCalculatingFees'
        authentication:
          $ref: '#/components/schemas/PaymentAuthentication'
        totals:
          $ref: '#/components/schemas/PaymentTotals'
    DateTimeOffset:
      description: |
        Date-time with time zone offset in ISO 8601 format without second fractions ([RFC 9557](https://www.rfc-editor.org/rfc/rfc9557.html)).
      type: string
      format: date-time-offset
      minLength: 25
      maxLength: 25
      example: '2025-09-01T22:05:48-08:00'
    EstimatedUpdateBefore:
      allOf:
        - description: When the payment status is estimated to be updated next.
        - $ref: '#/components/schemas/DateTimeOffset'
    PaymentCheckoutDescription:
      allOf:
        - $ref: '#/components/schemas/MediumString'
        - description: |
            A description of the checkout session only if the payment was part of a checkout.
            This will be visible to the buyer in the payment page but not in the bank or card statement.
          example: Order 202510-0232
    PaymentOriginBase:
      type: object
      required:
        - type
      properties:
        type:
          description: |
            The payment origin type.

            - `api`: The payment was created via the API.
            - `checkout`: The payment was created as an attempt of a checkout session.
          type: string
          enum:
            - api
            - checkout
    PaymentOriginApi:
      allOf:
        - $ref: '#/components/schemas/PaymentOriginBase'
    PaymentOriginCheckout:
      allOf:
        - $ref: '#/components/schemas/PaymentOriginBase'
        - required:
            - id
          properties:
            id:
              $ref: '#/components/schemas/CheckoutId'
    PaymentOrigin:
      description: The origin of the payment creation.
      allOf:
        - $ref: '#/components/schemas/PaymentOriginApi'
        - $ref: '#/components/schemas/PaymentOriginCheckout'
      discriminator:
        propertyName: type
        mapping:
          api: '#/components/schemas/PaymentOriginApi'
          checkout: '#/components/schemas/PaymentOriginCheckout'
    StandingInstructionDetails:
      description: The details of the standing instruction the payment is associated with.
      type: object
      required:
        - status
        - terms
        - first
      properties:
        id:
          $ref: '#/components/schemas/StandingInstructionId'
        status:
          $ref: '#/components/schemas/StandingInstructionStatus'
        terms:
          $ref: '#/components/schemas/StandingInstructionTerms'
        first:
          description: The reference to the first payment in the standing instruction sequence.
          type: object
          required:
            - type
            - id
          properties:
            type:
              description: The type of the reference for the first payment.
              type: string
              enum:
                - payment
            id:
              allOf:
                - description: The identifier of the first payment in the standing instruction sequence.
                - $ref: '#/components/schemas/PaymentId'
    RefundId:
      allOf:
        - $ref: '#/components/schemas/Id'
        - description: The unique identifier of the refund of a payment.
          example: rfd_4a4m2pjycdb1jbj68h1rvk9kcz
    RefundStatus:
      description: |
        The status of the refund payment.
        See the [list, transitions, and description of each status](/payments/refunds/lifecycle) for more details.
      type: string
      enum:
        - initiated
        - completed
        - declined
        - failed
    RefundReason:
      allOf:
        - description: |
            The reason for the refund status when it requires additional steps or is a failure state.
            See all the [possible refund reasons for each status](/payments/refunds/lifecycle/reason-codes) for more details.
          properties:
            code:
              description: |
                Code to identify the cause of the refund status.
                See all the [possible refund reason codes for each status](/payments/refunds/lifecycle/reason-codes) for more details.
            description:
              description: Human-readable description of the reason for the refund status.
        - $ref: '#/components/schemas/ReasonBase'
    RefundType:
      description: The type of refund to be processed.
      type: string
      enum:
        - full
        - partial
    RefundOriginBase:
      type: object
      required:
        - type
      properties:
        type:
          description: |
            The refund origin type.

            - `api`: The refund was created via the API.
          type: string
          enum:
            - api
    RefundOriginApi:
      allOf:
        - $ref: '#/components/schemas/RefundOriginBase'
    RefundOrigin:
      description: The origin of the refund creation.
      allOf:
        - $ref: '#/components/schemas/RefundOriginApi'
      discriminator:
        propertyName: type
        mapping:
          api: '#/components/schemas/RefundOriginApi'
    PaymentRefunds:
      description: A list of refunds associated with the payment if any.
      type: array
      uniqueItems: true
      items:
        type: object
        required:
          - id
          - status
          - type
          - reference
          - created_at
          - updated_at
          - amount
          - origin
        properties:
          id:
            $ref: '#/components/schemas/RefundId'
          status:
            $ref: '#/components/schemas/RefundStatus'
          reason:
            $ref: '#/components/schemas/RefundReason'
          type:
            $ref: '#/components/schemas/RefundType'
          reference:
            $ref: '#/components/schemas/Reference'
          created_at:
            $ref: '#/components/schemas/CreatedAt'
          updated_at:
            $ref: '#/components/schemas/UpdatedAt'
          amount:
            $ref: '#/components/schemas/AmountMinor'
          origin:
            $ref: '#/components/schemas/RefundOrigin'
    GetPaymentResponse:
      type: object
      required:
        - id
        - status
        - reference
        - created_at
        - updated_at
        - amount
        - currency
        - origin
        - method
        - splits
        - refunds
        - totals
        - events
      properties:
        id:
          $ref: '#/components/schemas/PaymentId'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        reason:
          $ref: '#/components/schemas/PaymentReason'
        reference:
          $ref: '#/components/schemas/Reference'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        estimated_update_before:
          $ref: '#/components/schemas/EstimatedUpdateBefore'
        amount:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          $ref: '#/components/schemas/PaymentCheckoutDescription'
        statement_descriptor:
          $ref: '#/components/schemas/StatementDescriptorResponse'
        origin:
          $ref: '#/components/schemas/PaymentOrigin'
        method:
          $ref: '#/components/schemas/PaymentMethodDetails'
        splits:
          allOf:
            - description: The splits for each the account involved in the funds flow for the original amount.
            - $ref: '#/components/schemas/SplitsCalculatedAndCalculatingFees'
        authentication:
          $ref: '#/components/schemas/PaymentAuthentication'
        standing_instruction:
          $ref: '#/components/schemas/StandingInstructionDetails'
        refunds:
          $ref: '#/components/schemas/PaymentRefunds'
        totals:
          $ref: '#/components/schemas/PaymentTotals'
    BaseRefundPaymentRequest:
      type: object
      required:
        - type
        - reference
      properties:
        type:
          $ref: '#/components/schemas/RefundType'
        reference:
          $ref: '#/components/schemas/Reference'
        webhooks:
          description: Configuration for webhooks to receive refund status updates.
          type: object
          required:
            - url
          properties:
            url:
              allOf:
                - description: The URL to which webhook events will be sent.
                  example: https://webhooks.titanauto.com/getpaid
                - $ref: '#/components/schemas/Url'
    FullRefundPaymentRequest:
      allOf:
        - $ref: '#/components/schemas/BaseRefundPaymentRequest'
    RefundSplitAccount:
      description: A refund split account.
      type: object
      required:
        - id
        - split
      properties:
        id:
          $ref: '#/components/schemas/AccountId'
        split:
          description: The amount in the payment currency to return from this account.
          type: object
          required:
            - amount
          properties:
            amount:
              allOf:
                - description: The amount returned from this account in the minor currency unit (e.g. 100 cents for 1 EUR).
                - $ref: '#/components/schemas/AmountMinor'
    PartialRefundPaymentRequest:
      allOf:
        - required:
            - amount
            - splits
          properties:
            type:
              type: string
            reference:
              type: string
            amount:
              allOf:
                - description: The amount to be refunded in minor currency unit (e.g. 100 cents for 1 EUR).
                - $ref: '#/components/schemas/AmountMinor'
            splits:
              description: The list of refund splits for the accounts involved in the funds flow.
              type: object
              required:
                - accounts
              properties:
                accounts:
                  description: |
                    The list of accounts involved in the refund that will return the funds.

                    All the accounts involved in the original payment receiving funds must be included
                    even if they did not receive funds in the payment or they are not returning funds in the refund.
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/RefundSplitAccount'
        - $ref: '#/components/schemas/BaseRefundPaymentRequest'
    RefundPaymentRequest:
      oneOf:
        - $ref: '#/components/schemas/FullRefundPaymentRequest'
        - $ref: '#/components/schemas/PartialRefundPaymentRequest'
      discriminator:
        propertyName: type
        mapping:
          full: '#/components/schemas/FullRefundPaymentRequest'
          partial: '#/components/schemas/PartialRefundPaymentRequest'
    BaseRefundPaymentResponse:
      type: object
      required:
        - id
        - type
        - status
        - reference
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/RefundId'
        type:
          $ref: '#/components/schemas/RefundType'
        status:
          $ref: '#/components/schemas/RefundStatus'
          const: initiated
        reference:
          $ref: '#/components/schemas/Reference'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
    FullRefundPaymentResponse:
      allOf:
        - $ref: '#/components/schemas/BaseRefundPaymentResponse'
        - required:
            - amount
            - splits
          properties:
            amount:
              allOf:
                - description: The full amount of the original payment to be refunded in minor units of the currency (e.g., cents for EUR).
                - $ref: '#/components/schemas/AmountMinor'
            splits:
              description: The list of refund splits for the accounts involved in the funds flow from the original payment.
              type: object
              required:
                - accounts
              properties:
                accounts:
                  description: The list of accounts involved in the original payment with the funds they are going to return to the buyer.
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/RefundSplitAccount'
    PartialRefundPaymentResponse:
      allOf:
        - $ref: '#/components/schemas/BaseRefundPaymentResponse'
    RefundPaymentResponse:
      oneOf:
        - $ref: '#/components/schemas/FullRefundPaymentResponse'
        - $ref: '#/components/schemas/PartialRefundPaymentResponse'
      discriminator:
        propertyName: type
        mapping:
          full: '#/components/schemas/FullRefundPaymentResponse'
          partial: '#/components/schemas/PartialRefundPaymentResponse'
    PaymentsFiltersRequest:
      description: Filtering payments.
      type: object
      properties:
        id:
          allOf:
            - description: The payment identifier to filter by using an exact match operation.
            - $ref: '#/components/schemas/PaymentId'
        reference:
          description: The payment reference to filter by using a contains operation.
          type: string
        seller_legal_name:
          description: The seller legal name to filter by using a contains operation.
          type: string
        statuses:
          description: The list of payment statuses to filter by.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PaymentStatus'
    PaymentsSortsRequest:
      description: Fields to sort the data by. If not set, the data will be sorted by the creation date descending.
      type: array
      minItems: 1
      uniqueItems: true
      items:
        allOf:
          - $ref: '#/components/schemas/BaseSortItemRequest'
          - properties:
              field:
                enum:
                  - created_at
                  - amount
                  - seller_legal_name
    QueryPaymentsRequest:
      allOf:
        - $ref: '#/components/schemas/BaseQueryRequest'
        - required:
            - type
          properties:
            type:
              type: string
              enum:
                - payments
            filters:
              $ref: '#/components/schemas/PaymentsFiltersRequest'
            sorts:
              $ref: '#/components/schemas/PaymentsSortsRequest'
    BasePaymentMethodHint:
      allOf:
        - $ref: '#/components/schemas/PaymentMethodBase'
        - required:
            - display_hint
          properties:
            display_hint:
              $ref: '#/components/schemas/PaymentMethodDisplayHint'
    CardPaymentMethodHint:
      allOf:
        - required:
            - scheme
          properties:
            type:
              type: string
            scheme:
              $ref: '#/components/schemas/CardScheme'
        - $ref: '#/components/schemas/BasePaymentMethodHint'
    PaymentMethodHint:
      description: The payment method used.
      oneOf:
        - $ref: '#/components/schemas/BasePaymentMethodHint'
        - $ref: '#/components/schemas/CardPaymentMethodHint'
      discriminator:
        propertyName: type
        mapping:
          card: '#/components/schemas/CardPaymentMethodHint'
          sepa_direct_debit: '#/components/schemas/BasePaymentMethodHint'
    QueryPaymentsResponse:
      allOf:
        - required:
            - type
          properties:
            type:
              type: string
              enum:
                - payments
            cursor:
              type: string
            data:
              items:
                required:
                  - id
                  - reference
                  - status
                  - amount
                  - currency
                  - created_at
                  - updated_at
                  - method
                  - seller
                  - parties
                properties:
                  id:
                    $ref: '#/components/schemas/PaymentId'
                  reference:
                    $ref: '#/components/schemas/Reference'
                  status:
                    $ref: '#/components/schemas/PaymentStatus'
                  amount:
                    $ref: '#/components/schemas/AmountMinor'
                  currency:
                    $ref: '#/components/schemas/Currency'
                  created_at:
                    $ref: '#/components/schemas/CreatedAt'
                  updated_at:
                    $ref: '#/components/schemas/UpdatedAt'
                  method:
                    $ref: '#/components/schemas/PaymentMethodHint'
                  seller:
                    $ref: '#/components/schemas/SellerRef'
                  parties:
                    description: The list of parties involved in the transaction.
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/PartyRef'
        - $ref: '#/components/schemas/PaginatedResponse'
    AccountsFiltersRequest:
      description: Filtering accounts.
      type: object
      properties:
        id:
          allOf:
            - description: The account identifier to filter by using an exact match operation.
            - $ref: '#/components/schemas/AccountId'
        legal_name:
          description: The account legal name to filter by using a contains operation.
          type: string
          maxLength: 255
        country:
          allOf:
            - description: The country to filter by using an exact match operation.
            - $ref: '#/components/schemas/Country'
    AccountsSortsRequest:
      description: Fields to sort the data by. If not set, the data will be sorted by the creation date descending.
      type: array
      minItems: 1
      uniqueItems: true
      items:
        allOf:
          - $ref: '#/components/schemas/BaseSortItemRequest'
          - properties:
              field:
                enum:
                  - id
                  - created_at
                  - legal_name
                  - country
    QueryAccountsRequest:
      allOf:
        - $ref: '#/components/schemas/BaseQueryRequest'
        - required:
            - type
          properties:
            type:
              type: string
              enum:
                - accounts
            filters:
              $ref: '#/components/schemas/AccountsFiltersRequest'
            sorts:
              $ref: '#/components/schemas/AccountsSortsRequest'
    QueryAccountsResponse:
      allOf:
        - required:
            - type
          properties:
            type:
              type: string
              enum:
                - accounts
            cursor:
              type: string
            data:
              items:
                required:
                  - id
                  - legal_name
                  - country
                  - created_at
                properties:
                  id:
                    $ref: '#/components/schemas/AccountId'
                  legal_name:
                    $ref: '#/components/schemas/AccountLegalName'
                  country:
                    $ref: '#/components/schemas/Country'
                  created_at:
                    $ref: '#/components/schemas/CreatedAt'
        - $ref: '#/components/schemas/PaginatedResponse'
    DocumentId:
      allOf:
        - $ref: '#/components/schemas/Id'
        - description: The unique identifier of the document.
          example: doc_4wt0wrfqwz0vkatave0fkjg046
    ThemeAsset:
      type: object
      required:
        - id
        - content_type
        - url
      properties:
        id:
          $ref: '#/components/schemas/DocumentId'
        content_type:
          type: string
          description: The media type of the theme asset.
          example: image/png
        url:
          allOf:
            - $ref: '#/components/schemas/Url'
            - description: The public URL of the theme asset.
              example: https://example.com/logo.png
    ThemeBusinessSettings:
      type: object
      required:
        - legal_name
      properties:
        legal_name:
          allOf:
            - $ref: '#/components/schemas/MediumString'
            - description: The legal business name displayed by the theme.
        trading_name:
          allOf:
            - $ref: '#/components/schemas/MediumString'
            - description: The trading name displayed by the theme.
    ThemeColorSettings:
      type: object
      required:
        - primary
        - secondary
      properties:
        primary:
          type: string
          description: The primary theme color as a hex RGB value.
          example: '#05495c'
        secondary:
          type: string
          description: The secondary theme color as a hex RGB value.
          example: '#e07b7b'
        text:
          type: string
          description: The text theme color as a hex RGB value.
          example: '#000000'
        error_text:
          type: string
          description: The error text theme color as a hex RGB value.
          example: '#b71d18'
    ThemeFontSettings:
      type: object
      properties:
        family:
          allOf:
            - $ref: '#/components/schemas/MediumString'
            - description: The font family used by the theme.
        size:
          type: string
          description: The base font size used by the theme.
          example: 0.875rem
        external_url:
          allOf:
            - $ref: '#/components/schemas/Url'
            - description: The URL of the external font stylesheet used by the theme.
              example: https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap
    AccountThemeSettings:
      type: object
      required:
        - logo
        - business
        - colors
      properties:
        logo:
          $ref: '#/components/schemas/ThemeAsset'
        icon:
          $ref: '#/components/schemas/ThemeAsset'
        business:
          $ref: '#/components/schemas/ThemeBusinessSettings'
        colors:
          $ref: '#/components/schemas/ThemeColorSettings'
        font:
          $ref: '#/components/schemas/ThemeFontSettings'
    AccountTheme:
      type: object
      required:
        - id
        - name
        - settings
        - is_default
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ThemeId'
        name:
          allOf:
            - $ref: '#/components/schemas/MediumString'
            - description: The name of the theme.
        settings:
          $ref: '#/components/schemas/AccountThemeSettings'
        is_default:
          type: boolean
          description: Whether this is the default theme for the account.
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
    GetThemesResponse:
      type: object
      required:
        - themes
      properties:
        themes:
          type: array
          description: The account themes.
          items:
            $ref: '#/components/schemas/AccountTheme'
    ApplicantRequest:
      description: The details of the person representing the seller that is applying for the Getpaid account if known at the time of application creation.
      type: object
      required:
        - email
      properties:
        email:
          allOf:
            - $ref: '#/components/schemas/Email'
            - description: The applicant's email address.
        first_name:
          allOf:
            - $ref: '#/components/schemas/ShortString'
            - description: The applicant's first name.
              example: Markus
              minLength: 2
        last_name:
          allOf:
            - $ref: '#/components/schemas/ShortString'
            - description: The applicant's last name.
              example: Doe
              minLength: 2
    BusinessLegalStructure:
      description: |
        The legal structure of the business.

        **It is required to provide the legal structure of the business if the country of registration is Canada (CA).**
      type: string
      enum:
        - ca_private_corp
        - ca_public_corp
        - ca_non_profit
    Address:
      allOf:
        - required:
            - line1
            - street_number
            - city
            - postal_code
        - $ref: '#/components/schemas/AddressOptionalFields'
    BaseRegistrationNumber:
      description: The company registration number.
      type: object
      required:
        - type
        - value
      properties:
        type:
          description: The type of registration number. See the list of supported [registration numbers per country](/integration/api/references/registration-numbers).
          type: string
          example: vat
        value:
          allOf:
            - $ref: '#/components/schemas/ShortString'
            - description: The registration number. See the format for each registration number type in the [registration numbers list](/integration/api/references/registration-numbers).
              example: DE123456789
    GermanRegistrationNumber:
      allOf:
        - $ref: '#/components/schemas/BaseRegistrationNumber'
        - required:
            - registry
          properties:
            registry:
              description: The Germany district court where the business is registered. See the [list of Germany registry courts](/integration/api/references/registration-numbers/germany-registry-courts).
              type: string
    RegistrationNumber:
      description: |
        The business' registration number.
        The registration number is validated based on the country of the business.
      anyOf:
        - $ref: '#/components/schemas/BaseRegistrationNumber'
        - $ref: '#/components/schemas/GermanRegistrationNumber'
      discriminator:
        propertyName: type
        mapping:
          vat: '#/components/schemas/BaseRegistrationNumber'
          de_vr: '#/components/schemas/GermanRegistrationNumber'
          de_hra: '#/components/schemas/GermanRegistrationNumber'
          de_hrb: '#/components/schemas/GermanRegistrationNumber'
          ca_cn: '#/components/schemas/BaseRegistrationNumber'
          ee_kmkr: '#/components/schemas/BaseRegistrationNumber'
          si_tin: '#/components/schemas/BaseRegistrationNumber'
    BusinessRequest:
      description: The seller business details if known at the time of application creation.
      type: object
      required:
        - legal_name
        - country
      properties:
        legal_name:
          allOf:
            - $ref: '#/components/schemas/MediumString'
            - description: The legal name of the business.
              example: Garage Germany AG
              minLength: 2
        country:
          allOf:
            - description: The country where the business is registered in the form of a two-letter [ISO 3166-1 alpha-2 country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2).
              example: DE
            - $ref: '#/components/schemas/Country'
        legal_structure:
          $ref: '#/components/schemas/BusinessLegalStructure'
        registered_address:
          allOf:
            - description: The registered address of the business.
            - $ref: '#/components/schemas/Address'
        registration_number:
          $ref: '#/components/schemas/RegistrationNumber'
    ApplicationType:
      description: |
        The type of application to create:

        - `onboarding`: to create a new account for the seller and start accepting payments.
        - `change_request`: to update an existing seller account with new information.
      type: string
      enum:
        - onboarding
        - change_request
    ApplicationWebhooksRequest:
      description: Configuration for webhooks to receive onboarding application status updates.
      type: object
      required:
        - url
      properties:
        url:
          allOf:
            - description: The URL to which webhook events will be sent.
              example: https://webhooks.titanauto.com/getpaid
            - $ref: '#/components/schemas/Url'
    BaseCreateApplicationRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ApplicationType'
        webhooks:
          $ref: '#/components/schemas/ApplicationWebhooksRequest'
    OnboardingApplicationRequest:
      allOf:
        - required:
            - reference
            - applicant
            - business
            - redirect
          properties:
            type:
              type: string
            reference:
              $ref: '#/components/schemas/Reference'
            applicant:
              $ref: '#/components/schemas/ApplicantRequest'
            business:
              $ref: '#/components/schemas/BusinessRequest'
            redirect:
              description: Configuration for the redirect behavior after the onboarding application is submitted.
              type: object
              required:
                - default
              properties:
                default:
                  allOf:
                    - $ref: '#/components/schemas/Url'
                    - description: The URL to which the seller will be redirected after the onboarding application is submitted.
                      example: https://titanauto.com/onboarding/complete?customer=53426
        - $ref: '#/components/schemas/BaseCreateApplicationRequest'
    ApplicationFieldRequest:
      description: |
        A field whose access for the seller is controlled by the change request application.
      type: object
      required:
        - name
        - access
      properties:
        name:
          description: The name of the field whose access is controlled by the application.
          type: string
          enum:
            - themes
        access:
          description: The level of access granted to the seller over the field while the application is open.
          type: string
          enum:
            - read_write
    ChangeRequestApplicationRequest:
      allOf:
        - required:
            - account
            - fields
          properties:
            type:
              type: string
            account:
              description: The seller account whose information is being updated by this change request.
              type: object
              required:
                - id
              properties:
                id:
                  $ref: '#/components/schemas/AccountId'
            fields:
              description: |
                The list of fields whose access is granted to the seller while the change request application is open.

                The application is scoped to these fields only — the seller can review and update them, and any other field remains unchanged.
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: '#/components/schemas/ApplicationFieldRequest'
            reference:
              $ref: '#/components/schemas/Reference'
            redirect:
              description: Configuration for the redirect behavior after the change request application is submitted.
              type: object
              required:
                - default
              properties:
                default:
                  allOf:
                    - $ref: '#/components/schemas/Url'
                    - description: The URL to which the seller will be redirected after the change request application is submitted.
                      example: https://titanauto.com/change-request/complete?customer=53426
            theme_id:
              allOf:
                - $ref: '#/components/schemas/ThemeId'
                - description: The ID of the platform theme used to brand the hosted change request page. This affects only the appearance of the page itself and does not change the seller account's theme settings. If not provided, the account's default theme is used.
        - $ref: '#/components/schemas/BaseCreateApplicationRequest'
    CreateApplicationRequest:
      oneOf:
        - $ref: '#/components/schemas/OnboardingApplicationRequest'
        - $ref: '#/components/schemas/ChangeRequestApplicationRequest'
      discriminator:
        propertyName: type
        mapping:
          onboarding: '#/components/schemas/OnboardingApplicationRequest'
          change_request: '#/components/schemas/ChangeRequestApplicationRequest'
    ApplicationId:
      allOf:
        - $ref: '#/components/schemas/Id'
        - description: The unique identifier of the onboarding application.
          example: app_4fekhxdpss1et7rjp8t7rdpnw4
    ApplicationStatus:
      description: The status of the onboarding application.
      type: string
      enum:
        - initiated
        - identity_verified
        - submitted
        - screened
        - approved
        - completed
        - cancelled
    ApplicationExpiresAt:
      allOf:
        - description: When the onboarding session will expire if not submitted and must be refreshed to extend its lifespan.
        - $ref: '#/components/schemas/DateTime'
    ApplicationFlow:
      description: The flow required for the onboarding application to complete.
      type: object
      required:
        - next_step
      properties:
        next_step:
          description: The next step required to complete the flow.
          type: object
          required:
            - type
            - url
          properties:
            type:
              description: The type of the next step.
              type: string
              enum:
                - redirect
            url:
              allOf:
                - $ref: '#/components/schemas/Url'
                - description: The URL to redirect the seller to complete the onboarding.
    CreateApplicationResponse:
      type: object
      required:
        - id
        - status
        - reference
        - created_at
        - updated_at
        - expires_at
        - account
        - flow
      properties:
        id:
          $ref: '#/components/schemas/ApplicationId'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
          const: initiated
        reference:
          $ref: '#/components/schemas/Reference'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        expires_at:
          $ref: '#/components/schemas/ApplicationExpiresAt'
        account:
          description: The account associated with the application, if created.
          type: object
          required:
            - id
          properties:
            id:
              $ref: '#/components/schemas/AccountId'
        flow:
          $ref: '#/components/schemas/ApplicationFlow'
    BusinessResponse:

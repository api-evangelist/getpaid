  parameters:
    GetpaidIdempotencyKey:
      name: Getpaid-Idempotency-Key
      in: header
      description: |
        A unique idempotency key to allow safe retrying.
        See [Getpaid API idempotency](/integration/api/idempotency) for more details.
      schema:
        type: string
        minLength: 10
        maxLength: 100
        pattern: ^[a-zA-Z0-9_-]{10,100}$
        example: 5c255194-30ec-11ed-a261-0242ac120002
    GetpaidTraceId:
      name: Getpaid-Trace-Id
      in: header
      description: The trace identifier for the request. It is a good idea to log this and provide it with any support requests
      required: true
      schema:
        type: string
        example: 96ce50247f87f540bb2d86771b3728b8
  headers:
    GetpaidTraceId:
      description: The trace identifier for the request. It is a good idea to log this and provide it with any support requests
      schema:
        type: string
        example: 96ce50247f87f540bb2d86771b3728b8
  responses:
    400BadRequest:
      description: Bad Request
      headers:
        Getpaid-Trace-Id:
          $ref: '#/components/headers/GetpaidTraceId'
    401Unauthorized:
      description: Unauthorized
      headers:
        Getpaid-Trace-Id:
          $ref: '#/components/headers/GetpaidTraceId'
    422InvalidParameters:
      description: Invalid Parameters
      headers:
        Getpaid-Trace-Id:
          $ref: '#/components/headers/GetpaidTraceId'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetailsBase'
              - type: object
                required:
                  - errors
                properties:
                  errors:
                    type: object
                    description: The JSON path of any request body fields or header names that are invalid with a description of the error
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    example:
                      currency:
                        - invalid_option
                  type:
                    example: https://docs.getpaid.io/integration/api/responses#422---invalid-parameters
                  title:
                    example: Invalid Parameters
                  status:
                    example: 422
    429TooManyRequests:
      description: Too Many Requests
      headers:
        Getpaid-Trace-Id:
          $ref: '#/components/headers/GetpaidTraceId'
    500InternalServerError:
      description: Internal Server Error
      headers:
        Getpaid-Trace-Id:
          $ref: '#/components/headers/GetpaidTraceId'
    404NotFound:
      description: Not Found
      headers:
        Getpaid-Trace-Id:
          $ref: '#/components/headers/GetpaidTraceId'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetailsBase'
              - type: object
                properties:
                  type:
                    example: https://docs.getpaid.io/integration/api/responses#404---not-found
                  title:
                    example: Not Found
                  status:
                    example: 404
    409Conflict:
      description: Conflict
      headers:
        Getpaid-Trace-Id:
          $ref: '#/components/headers/GetpaidTraceId'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetailsBase'
              - type: object
                properties:
                  type:
                    example: https://docs.getpaid.io/integration/api/responses#409---conflict
                  title:
                    example: Conflict
                  status:
                    example: 409
                  detail:
                    example: Request cannot be completed due to the current state of the server
